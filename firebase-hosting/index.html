<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>WBTE Email Services</title>
    <link rel="stylesheet" href="/verification.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="verification-panel" aria-labelledby="page-title">
        <header class="brand">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span>
            <strong>WBTE</strong>
            <small>Web-Based Teacher Evaluation</small>
          </span>
        </header>
        <div class="status-symbol status-symbol-neutral" aria-hidden="true">
          <span>@</span>
        </div>
        <p class="eyebrow">Secure account services</p>
        <h1 id="page-title">Open your verification email</h1>
        <p class="message">
          Use the private link sent to your inbox to verify your WBTE email address.
        </p>
      </section>
      <p class="security-note">Only use links from email you requested.</p>
    </main>
  </body>
</html>
